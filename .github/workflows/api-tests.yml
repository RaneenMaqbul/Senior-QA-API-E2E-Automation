name: Postman API Tests

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman and HTML reporter
        run: npm install --global newman newman-reporter-htmlextra

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Postman collection
        run: |
          newman run "collections/Senior QA - API E2E Automation.postman_collection.json" \
            --environment "environments/Senior QA - Simple Grocery Store.postman_environment.json" \
            --reporters "cli,htmlextra" \
            --reporter-htmlextra-export "reports/api-test-report.html"

      - name: Verify HTML report exists
        if: always()
        run: test -f "reports/api-test-report.html"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-api-test-report
          path: reports/api-test-report.html
          if-no-files-found: error
